version: '3.8'

# ========================================================
# OpenClaw Memory System
# ========================================================
# 
# 🚀 Quick Start:
#   1. cp .env.example .env
#   2. แก้ .env ใส่ API Key (ข้ามได้ถ้าทดสอบ)
#   3. docker-compose up -d
#
# 📖 CLI:
#   docker-compose exec memory stats
#   docker-compose exec memory remember "Boss loves coffee" preference
#   docker-compose exec memory recall "what does boss like"
#   docker-compose exec memory interactive
#
# 🌐 API Server:
#   docker-compose up -d api
#   curl http://localhost:3000/stats
#
# 📝 Logs:
#   docker-compose logs -f
#
# 🛑 Stop:
#   docker-compose down
# ========================================================

services:
  # CLI mode (default)
  memory:
    build: .
    container_name: openclaw-memory
    volumes:
      - ./memory:/app/memory
      - ./logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    command: ["stats"]

  # REST API Server
  api:
    build: .
    container_name: openclaw-memory-api
    ports:
      - "3000:3000"
    volumes:
      - ./memory:/app/memory
      - ./logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    command: ["node", "dist/server.js"]
